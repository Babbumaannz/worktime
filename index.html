<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work hours tracker</title>
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#16302b;--mute:#5d726d;--line:#d5e0dd;--accent:#0f6b5c;--accent-ink:#fff;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a18;--card:#172623;--ink:#e6f1ee;--mute:#92aaa4;--line:#2a3f3b;--accent:#3fb59f;--accent-ink:#06211c;--danger:#f2877f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a18;--card:#172623;--ink:#e6f1ee;--mute:#92aaa4;--line:#2a3f3b;--accent:#3fb59f;--accent-ink:#06211c;--danger:#f2877f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:170px;resize:vertical;font-size:.9rem}
a.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 6px}
.note{color:var(--mute);font-size:.85rem;margin:6px 0 0;min-height:1.2em}
input:focus,select:focus,textarea:focus,a.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
button{font:inherit;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
button.del{background:transparent;color:var(--danger);padding:4px 8px;font-weight:500}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weeknav strong{text-align:center;flex:1}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.totals div{background:var(--bg);border-radius:10px;padding:12px}
.totals span{display:block;font-size:.85rem;color:var(--mute)}
.totals b{font-size:1.6rem}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--mute);font-size:.85rem}
td.n,th.n{text-align:right}
.empty{color:var(--mute);margin:8px 0 0}
.err{color:var(--danger);margin:8px 0 0;min-height:1.2em;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Work hours tracker</h1>

<section class="card">
  <div class="grid">
    <div class="full"><label for="rate">Hourly rate ($)</label><input id="rate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 28.50"></div>
    <div class="full"><label for="date">Date</label><input id="date" type="date"></div>
    <div><label for="start">Start time</label><select id="start"></select></div>
    <div><label for="end">Finish time</label><select id="end"></select></div>
    <div class="full"><label for="brk">Unpaid break</label><select id="brk"><option value="0">No break</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></div>
    <div class="full"><button id="add" type="button">Add shift</button><p class="err" id="err" role="alert"></p></div>
  </div>
</section>

<section class="card">
  <div class="weeknav">
    <button class="ghost" id="prev" type="button" aria-label="Previous week">Prev</button>
    <strong id="range"></strong>
    <button class="ghost" id="next" type="button" aria-label="Next week">Next</button>
  </div>
  <div class="totals">
    <div><span>Total hours</span><b id="tHours">0.00</b></div>
    <div><span>Total pay</span><b id="tPay">$0.00</b></div>
  </div>
  <div class="scroll">
    <table>
      <thead><tr><th>Day</th><th>Start</th><th>Finish</th><th class="n">Break</th><th class="n">Hours</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="empty" id="empty">No shifts this week yet. Add one above.</p>
</section>

<section class="card">
  <label for="summary">Week summary</label>
  <textarea id="summary" readonly></textarea>
  <div class="actions">
    <a class="btn" id="mail" href="mailto:">Email this week</a>
    <button class="ghost" id="copy" type="button">Copy summary</button>
  </div>
  <p class="note" id="copied"></p>
</section>
</main>

<script>
(function(){
  var KEY="hours-tracker-v1";
  var state={rate:"",shifts:[]};
  try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(p&&Array.isArray(p.shifts)){state=p;}}}catch(e){}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}

  var $=function(id){return document.getElementById(id)};
  function pad(n){return (n<10?"0":"")+n}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function parse(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2])}
  function monday(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return x}
  function mins(t){var a=t.split(":");return +a[0]*60+ +a[1]}
  function shiftHours(sh){var m=mins(sh.end)-mins(sh.start);if(m<=0)m+=1440;m-=sh.brk;return Math.max(m,0)/60}
  function fmtTime(t){var a=t.split(":"),h=+a[0],ap=h>=12?"pm":"am";h=h%12||12;return h+":"+a[1]+" "+ap}
  function money(n){return "$"+n.toLocaleString("en-NZ",{minimumFractionDigits:2,maximumFractionDigits:2})}

  var ranges={start:[5*60,13*60],end:[9*60,21*60]};
  ["start","end"].forEach(function(id){
    var h='<option value="">Select</option>';
    for(var m=ranges[id][0];m<=ranges[id][1];m+=30){var t=pad(Math.floor(m/60))+":"+pad(m%60);h+='<option value="'+t+'">'+fmtTime(t)+'</option>';}
    $(id).innerHTML=h;
  });

  var weekStart=monday(new Date());
  $("date").value=iso(new Date());
  $("rate").value=state.rate;

  $("rate").addEventListener("input",function(){state.rate=this.value;save();render()});
  $("prev").addEventListener("click",function(){weekStart.setDate(weekStart.getDate()-7);render()});
  $("next").addEventListener("click",function(){weekStart.setDate(weekStart.getDate()+7);render()});

  $("add").addEventListener("click",function(){
    var d=$("date").value,st=$("start").value,en=$("end").value,b=parseInt($("brk").value,10)||0;
    var err=$("err");
    if(!d||!st||!en){err.textContent="Enter a date, start time and finish time.";return}
    if(b<0){err.textContent="Break can’t be negative.";return}
    err.textContent="";
    state.shifts.push({id:Date.now()+Math.random(),date:d,start:st,end:en,brk:b});
    save();
    weekStart=monday(parse(d));
    $("start").value="";$("end").value="";$("brk").value="0";
    render();
  });

  $("rows").addEventListener("click",function(e){
    var id=e.target.getAttribute("data-del");
    if(id===null)return;
    state.shifts=state.shifts.filter(function(x){return String(x.id)!==id});
    save();render();
  });

  function render(){
    var end=new Date(weekStart);end.setDate(end.getDate()+6);
    var o={day:"numeric",month:"short"};
    $("range").textContent=weekStart.toLocaleDateString("en-NZ",o)+" to "+end.toLocaleDateString("en-NZ",o)+", "+end.getFullYear();
    var a=iso(weekStart),z=iso(end);
    var list=state.shifts.filter(function(x){return x.date>=a&&x.date<=z}).sort(function(p,q){return (p.date+p.start)<(q.date+q.start)?-1:1});
    var total=0,html="";
    list.forEach(function(x){
      var h=shiftHours(x);total+=h;
      var dd=parse(x.date).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"});
      html+="<tr><td>"+dd+"</td><td>"+fmtTime(x.start)+"</td><td>"+fmtTime(x.end)+"</td><td class=\"n\">"+x.brk+" min</td><td class=\"n\">"+h.toFixed(2)+"</td><td><button class=\"del\" type=\"button\" data-del=\""+x.id+"\" aria-label=\"Delete shift\">Delete</button></td></tr>";
    });
    $("rows").innerHTML=html;
    $("empty").style.display=list.length?"none":"block";
    var rate=parseFloat(state.rate)||0;
    $("tHours").textContent=total.toFixed(2);
    $("tPay").textContent=money(total*rate);
    var head="Hours for "+$("range").textContent;
    var fo={weekday:"short",day:"numeric",month:"short",year:"numeric"};
    var subj="Work hours: "+weekStart.toLocaleDateString("en-NZ",fo)+" to "+end.toLocaleDateString("en-NZ",fo);
    var lines=list.map(function(x){
      return parse(x.date).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"})+": "+fmtTime(x.start)+" to "+fmtTime(x.end)+", break "+x.brk+" min, "+shiftHours(x).toFixed(2)+" hours";
    });
    var text=head+"\n\n"+(lines.length?lines.join("\n"):"No shifts this week.")+"\n\nTotal hours: "+total.toFixed(2)+"\nHourly rate: "+money(rate)+"\nTotal pay: "+money(total*rate)+" (before tax)";
    $("summary").value=text;
    $("mail").setAttribute("href","mailto:?subject="+encodeURIComponent(subj)+"&body="+encodeURIComponent(text));
    $("copied").textContent="";
  }
  $("copy").addEventListener("click",function(){
    var ta=$("summary"),note=$("copied");
    function ok(){note.textContent="Copied."}
    function manual(){
      try{ta.focus();ta.select();if(document.execCommand("copy")){ok();return}}catch(e){}
      note.textContent="Couldn’t copy automatically. Press and hold the text above to copy it.";
    }
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(ok,manual)}else{manual()}
    }catch(e){manual()}
  });

  render();
})();
</script>
</body>
</html>
